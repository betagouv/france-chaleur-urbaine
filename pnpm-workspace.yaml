onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - sharp

publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'

overrides:
  # mermaid and posthog-js can keep DOMPurify <3.4.17 locked, vulnerable (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr, GHSA-c6gr-qvv4-5v3f)
  dompurify@<3.4.17: '>=3.4.17'
  # chevrotain (via mermaid) pins lodash-es 4.17.23, vulnerable (GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh)
  lodash-es@<4.18.0: '>=4.18.0'

peerDependencyRules:
  allowedVersions:
    # next-auth declares nodemailer ^7 as peer; v10 is API-compatible for createTransport/sendMail
    nodemailer: '10'
