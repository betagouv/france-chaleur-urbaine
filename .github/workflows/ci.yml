name: CI

# Controls when the action will run.
on: [push]

permissions:
  contents: read

jobs:
  CI:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24]
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: fcu
          POSTGRES_PASSWORD: fcu_pass
          POSTGRES_DB: fcu_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://fcu:fcu_pass@localhost:5432/fcu_db

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node 🔧
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies 💾
        run: pnpm install --frozen-lockfile

      - name: Use matching publicodes branch if any 🔀
        run: ./scripts/fetch-publicodes-branch.sh

      - name: Audit 🛡️
        # Blocks the build on critical vulnerabilities only. Lower severities do not fail the build:
        # Dependabot security updates (.github/dependabot.yml + repo settings) open PRs for them.
        run: pnpm audit --audit-level=critical

      - name: Lint 🧹
        run: pnpm lint:ci

      - name: Run database migrations 🔄
        run: pnpm db:migrate

      - name: Test ✅
        run: pnpm test

      - name: Build 📦
        run: pnpm build
